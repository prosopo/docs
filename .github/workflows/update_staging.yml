# Ops: after a push to the default branch, opens a PR bringing staging up to
# date with it. CI is ci.yml; releases are release.yml. Follow the existing
# layout and conventions; a new workflow, new stage or structural change needs a
# written justification in the PR description and review by the .github/ code
# owners.

name: update_staging

on:
    push:
        branches: [main]
    workflow_dispatch:
        inputs:
            concurrency-key:
                description: "Concurrency group override; empty means one run per ref."
                type: string
                default: ""

concurrency:
    group: ${{ inputs.concurrency-key || format('update-staging-{0}', github.ref) }}
    cancel-in-progress: true

permissions:
    contents: read

defaults:
    run:
        shell: bash --noprofile --norc -euo pipefail {0}

env:
    NODE_OPTIONS: --max-old-space-size=4096
    CARGO_TERM_COLOR: always
    CARGO_INCREMENTAL: 0
    CARGO_NET_RETRY: 10
    RUST_BACKTRACE: short
    FORCE_COLOR: 1
    TURBO_TELEMETRY_DISABLED: 1
    DO_NOT_TRACK: 1
    PYTHONUNBUFFERED: 1
    PIP_DISABLE_PIP_VERSION_CHECK: 1

jobs:
    pr-into-staging:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
              timeout-minutes: 5
              with:
                  repository: prosopo/github_actions
                  ref: 7a52d4663836059f0c6cf1c7a29186cd4d8b49a4
                  path: .shared-actions

            - uses: ./.shared-actions/.github/actions/print_contexts
              timeout-minutes: 2
              with:
                  INPUTS_CONTEXT: ${{ toJson(inputs) }}
                  VARS_CONTEXT: ${{ toJson(vars) }}

            # Under act (local runs) this only prints the PR it would open.
            - name: PR the default branch into staging
              timeout-minutes: 5
              env:
                  # The bot, not GITHUB_TOKEN: a PR opened with GITHUB_TOKEN
                  # starts no workflows, so ci.yml would never run on it.
                  GH_TOKEN: ${{ secrets.PROSOPONATOR_PAT }}
                  HEAD: ${{ github.event.repository.default_branch }}
              run: |
                  echo "open PR $HEAD -> staging on $GITHUB_REPOSITORY (act=${ACT:-false})"
                  if [[ -n "${ACT:-}" ]]; then exit 0; fi
                  timeout 60 gh api user --jq '"acting as " + .login'
                  timeout 120 gh pr create --repo "$GITHUB_REPOSITORY" --base staging --head "$HEAD" \
                      --title "Bring staging up to date with $HEAD" --body "Merges $HEAD into staging."
