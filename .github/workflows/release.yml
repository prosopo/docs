# Release entry point: on a push to the default branch or staging, builds the
# site and cuts a GitHub release named after package.json's version (staging
# gets a rolling staging-release prerelease). The site itself is deployed by
# Netlify's git integration (netlify.toml), not here; CI is ci.yml. Follow the
# existing layout and conventions; a new workflow, new stage or structural
# change needs a written justification in the PR description and review by the
# .github/ code owners.

name: release

on:
    push:
        branches: [main, staging]
    workflow_dispatch:
        inputs:
            concurrency-key:
                description: "Concurrency group override; empty means one release per branch."
                type: string
                default: ""

concurrency:
    group: ${{ inputs.concurrency-key || format('release-{0}', github.ref) }}
    cancel-in-progress: true

permissions:
    contents: read

defaults:
    run:
        shell: bash --noprofile --norc -euo pipefail {0}

env:
    NODE_OPTIONS: --max-old-space-size=4096
    CARGO_TERM_COLOR: always
    CARGO_INCREMENTAL: 0
    CARGO_NET_RETRY: 10
    RUST_BACKTRACE: short
    FORCE_COLOR: 1
    TURBO_TELEMETRY_DISABLED: 1
    DO_NOT_TRACK: 1
    PYTHONUNBUFFERED: 1
    PIP_DISABLE_PIP_VERSION_CHECK: 1

jobs:
    release:
        runs-on: ubuntu-latest
        timeout-minutes: 45
        env:
            # The bot, not GITHUB_TOKEN: GitHub starts no workflows from a tag
            # or release that GITHUB_TOKEN creates, so release events would be lost.
            GH_TOKEN: ${{ secrets.PROSOPONATOR_PAT }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
              timeout-minutes: 5
              with:
                  submodules: "recursive"

            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
              timeout-minutes: 5
              with:
                  repository: prosopo/github_actions
                  ref: 7a52d4663836059f0c6cf1c7a29186cd4d8b49a4
                  path: .shared-actions

            - uses: ./.shared-actions/.github/actions/print_contexts
              timeout-minutes: 2
              with:
                  INPUTS_CONTEXT: ${{ toJson(inputs) }}
                  VARS_CONTEXT: ${{ toJson(vars) }}

            - name: Detect env
              id: env
              timeout-minutes: 2
              env:
                  REF: ${{ github.ref }}
                  DEFAULT_REF: refs/heads/${{ github.event.repository.default_branch }}
              run: |
                  VERSION=$(jq -r '.version' < package.json)
                  if [[ -z "$VERSION" || "$VERSION" == "null" ]]; then
                      echo "Failed to get version"
                      exit 1
                  fi
                  echo "version=$VERSION" >> "$GITHUB_OUTPUT"

                  if [[ "$REF" == "$DEFAULT_REF" ]]; then
                      {
                          echo "env=production"
                          echo "gh_release_tag=v$VERSION"
                      } >> "$GITHUB_OUTPUT"
                  elif [[ "$REF" == "refs/heads/staging" ]]; then
                      {
                          echo "env=staging"
                          echo "gh_release_tag=staging-release"
                          echo "gh_prerelease=true"
                      } >> "$GITHUB_OUTPUT"
                  else
                      echo "cannot release from $REF"
                      exit 1
                  fi

            - uses: ./.shared-actions/.github/actions/setup-pnpm
              timeout-minutes: 15
              with:
                  node-version-file: .nvmrc

            - name: Build
              timeout-minutes: 30
              run: timeout 29m pnpm run build

            # Under act (local runs) the release steps only print what they would do.
            - name: Show release target
              timeout-minutes: 2
              env:
                  TAG: ${{ steps.env.outputs.gh_release_tag }}
              run: |
                  echo "release $TAG on $GITHUB_REPOSITORY (act=${ACT:-false})"
                  if [[ -z "${ACT:-}" ]]; then timeout 60 gh api user --jq '"acting as " + .login'; fi

            - name: Purge gh prerelease
              if: ${{ steps.env.outputs.gh_prerelease && !env.ACT }}
              timeout-minutes: 5
              continue-on-error: true # the release may not exist yet
              env:
                  TAG: ${{ steps.env.outputs.gh_release_tag }}
              run: timeout 120 gh release delete "$TAG" --yes --cleanup-tag

            - name: Github release
              if: ${{ !env.ACT }}
              timeout-minutes: 5
              continue-on-error: true # the release may already exist
              env:
                  TAG: ${{ steps.env.outputs.gh_release_tag }}
              run: timeout 120 gh release create --generate-notes "$TAG"

            - name: Mark Github release as prerelease
              if: ${{ steps.env.outputs.gh_prerelease && !env.ACT }}
              timeout-minutes: 5
              continue-on-error: true # the release may not resolve yet
              env:
                  TAG: ${{ steps.env.outputs.gh_release_tag }}
              run: timeout 120 gh release edit "$TAG" --prerelease

            - name: Release notification
              if: ${{ always() && !env.ACT }}
              timeout-minutes: 2
              env:
                  SLACK_URL: ${{ secrets.SLACKBOT_DEVOPS }}
                  STATUS: ${{ job.status }}
                  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
                  LABEL: ${{ steps.env.outputs.env }} ${{ steps.env.outputs.gh_release_tag }}
              run: |
                  if [[ "$STATUS" == "success" ]]; then icon=":check-passed:"; word=succeeded; else icon=":check-failed:"; word=failed; fi
                  payload=$(jq -n --arg text "$icon Release <$RUN_URL|$LABEL> $word." '{text: $text}')
                  timeout 60 curl -fsS -X POST -H 'Content-type: application/json' --data "$payload" "$SLACK_URL"
